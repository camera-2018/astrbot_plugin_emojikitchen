name: Update emoji index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: update-emoji-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build compact emoji index
        run: python scripts/build_emoji_index.py

      - name: Commit updated index
        run: |
          if [ -z "$(git status --porcelain -- assets/emoji_index.json.gz)" ]; then
            echo "Emoji index is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/emoji_index.json.gz
          git commit -m "chore: update emoji kitchen index"
          git push
